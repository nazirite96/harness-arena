<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Harness Arena{% endblock %}</title>
<style>
:root{--fg:#111;--muted:#666;--line:#e5e5e5;--bg:#fff;--acc:#d0342c;--ok:#1a7f37;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--muted:#999;--line:#333;--bg:#111;--acc:#ff6b61;--ok:#3fb950;--bad:#f85149}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,system-ui,"Apple SD Gothic Neo",sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
header a{color:var(--fg);text-decoration:none;font-weight:600}
main{padding:12px 16px;max-width:1100px;margin:0 auto}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
tr.ref{background:rgba(208,52,44,.06)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
.ok{color:var(--ok)} .bad{color:var(--bad)} .muted{color:var(--muted)}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(28px,1fr));gap:4px}
.cell{height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.cell.p{background:var(--ok)} .cell.f{background:var(--bad)} .cell.e{background:#999}
form input,form select,form button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box;margin:4px 0}
form button{background:var(--acc);color:#fff;border:0;font-weight:600}
pre{white-space:pre-wrap;word-break:break-word;background:rgba(127,127,127,.08);padding:10px;border-radius:8px;font-size:13px}
.step{border-left:3px solid var(--line);padding:8px 12px;margin:10px 0}
.step.user{border-color:var(--acc)} .step .meta{font-size:12px;color:var(--muted)}
details summary{cursor:pointer;color:var(--muted)}
details p{margin:4px 0 10px}
.steps{counter-reset:s;display:grid;gap:12px}
.stepcard{position:relative;border:1px solid var(--line);border-radius:12px;padding:14px 16px 14px 56px}
.stepcard::before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:14px;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.stepcard h3{margin:0 0 6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}.kv b{color:var(--muted);font-weight:600}
.hero{padding:20px 0 8px}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;color:var(--muted)}
.pill{display:inline-block;background:rgba(208,52,44,.1);color:var(--acc);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;margin:4px 6px 0 0}
.timeline td:first-child{font-weight:700;white-space:nowrap}
.kiosk main{max-width:none;font-size:18px}.kiosk table{font-size:20px}.kiosk th,.kiosk td{padding:14px 16px}.kiosk header{display:none}
.big{font-size:22px;font-weight:700}
.formula{font-family:ui-monospace,Menlo,monospace;background:rgba(127,127,127,.08);padding:4px 10px;border-radius:8px;display:inline-block}
h2{margin:26px 0 8px;font-size:20px}
</style>
</head>
<body class="{% if kiosk %}kiosk{% endif %}">
<header><a href="/">🏟 Harness Arena</a><a href="/guide" class="muted">참가 방법</a><a href="/team" class="muted">팀 페이지</a><span class="muted" style="margin-left:auto;font-size:12px">opencode 번들 대회 · SWE-bench Verified</span></header>
<main>{% block body %}{% endblock %}</main>
</body></html>
