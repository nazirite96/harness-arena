[project]
name = "harness-arena"
version = "0.1.0"
description = "Competition platform: teams submit opencode config bundles, scored on SWE-bench Verified via Harbor."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "harbor==0.22.0",
    "typer>=0.16.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.11",
    "rich>=13",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]
curate = ["datasets>=3.0", "huggingface_hub>=0.25"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
arena = "arena.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arena", "arena_harness", "worker", "web"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
